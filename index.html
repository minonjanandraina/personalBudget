<!doctype html>
<!-- Déclare que le document est du HTML5 -->
<html lang="fr">
  <!-- Racine du document, langue française -->
  <head>
    <!-- Zone d'en-tête : informations sur la page (non affichées) -->
    <meta charset="utf-8" />
    <!-- Encodage des caractères : permet les accents -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Adapte la page à la largeur du téléphone (mobile first) -->
    <title>Volako</title>
    <!-- Titre de la page -->
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Charge la feuille de style de l'application -->
  </head>
  <!-- Fin de l'en-tête -->
  <body>
    <!-- Contenu visible de la page -->
    <div id="app"></div>
    <!-- Zone vide où le JavaScript dessine l'application -->
    <script type="module" src="/src/main.js"></script>
    <!-- Lance le programme principal (module JavaScript) -->
  </body>
  <!-- Fin du contenu visible -->
</html>
<!-- Fin du document -->
